<div class="bg-grey-50" id="about">
  <div class="container flex flex-col items-center py-16 md:py-20 lg:flex-row">
    <div class="w-full text-center sm:w-3/4 lg:w-3/5 lg:text-left">
      <h2 class="font-header text-4xl font-semibold uppercase text-primary sm:text-5xl lg:text-6xl">{{ts.t().ABOUT_TITLE}}</h2>
      <h4 class="pt-6 font-header text-xl font-medium text-black sm:text-2xl lg:text-3xl">{{ts.t().ABOUT_SUB}}</h4>
      <p class="pt-6 font-body leading-relaxed text-grey-20">
        {{ts.t().ABOUT_DESC}}
      </p>

    <div class="w-full pl-0 pt-10 sm:w-3/4 lg:w-2/5 lg:pl-12 lg:pt-0">
      <!-- Lenguajes -->
      <div class="mb-8">
        <h4 class="font-body font-semibold uppercase text-black mb-4">{{ts.t().ABOUT_LANG}}</h4>
        <div class="flex flex-wrap gap-3">
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">Java</span>
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">TypeScript</span>
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">JavaScript</span>
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">SQL</span>
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">C</span>
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">HTML</span>
          <span class="rounded-full bg-primary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">CSS</span>
        </div>
      </div>

      <!-- Frameworks -->
      <div class="mb-8">
        <h4 class="font-body font-semibold uppercase text-black mb-4">{{ts.t().ABOUT_FW}}</h4>
        <div class="flex flex-wrap gap-3">
          <span class="rounded-full bg-yellow px-4 py-2 font-body text-sm font-bold text-secondary shadow transition-transform hover:-translate-y-1 cursor-default">Spring Boot</span>
          <span class="rounded-full bg-yellow px-4 py-2 font-body text-sm font-bold text-secondary shadow transition-transform hover:-translate-y-1 cursor-default">Angular</span>
          <span class="rounded-full bg-yellow px-4 py-2 font-body text-sm font-bold text-secondary shadow transition-transform hover:-translate-y-1 cursor-default">Tailwind CSS</span>
        </div>
      </div>

      <!-- Bases de Datos -->
      <div>
        <h4 class="font-body font-semibold uppercase text-black mb-4">{{ts.t().ABOUT_DB}}</h4>
        <div class="flex flex-wrap gap-3">
          <span class="rounded-full bg-secondary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">PostgreSQL</span>
          <span class="rounded-full bg-secondary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">MySQL</span>
          <span class="rounded-full bg-secondary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">MariaDB</span>
          <span class="rounded-full bg-secondary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">SQLite</span>
          <span class="rounded-full bg-secondary px-4 py-2 font-body text-sm font-bold text-white shadow transition-transform hover:-translate-y-1 cursor-default">MongoDB</span>
