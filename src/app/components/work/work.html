<div class="container py-16 md:py-20" id="work">
  <h2 class="text-center font-header text-4xl font-semibold uppercase text-primary sm:text-5xl lg:text-6xl">{{ts.t().WORK_TITLE}}</h2>
  <h3 class="pt-6 text-center font-header text-xl font-medium text-black sm:text-2xl lg:text-3xl">{{ts.t().WORK_SUB}}</h3>
  <div class="relative mx-auto mt-12 flex w-full flex-col lg:w-2/3">
    <span class="left-2/5 absolute inset-y-0 ml-10 hidden w-0.5 bg-grey-40 md:block"></span>
    
    <div class="mt-8 flex flex-col text-center md:flex-row md:text-left">
      <div class="md:w-2/5">
        <div class="flex justify-center md:justify-start">
          <span class="shrink-0 flex flex-col items-center justify-center">
            <i class="bx bx-store-alt text-5xl text-primary"></i>
            <span class="mt-1 font-header font-bold text-black text-lg">Stock Store</span>
          </span>
          <div class="relative ml-6 hidden w-full md:block">
            <span class="absolute inset-x-0 top-1/2 h-px -translate-y-1/2 transform bg-grey-70"></span>
          </div>
        </div>
      </div>
      <div class="md:w-3/5 mt-8 md:mt-0">
        <div class="relative flex md:pl-18">
          <span class="absolute left-8 top-1 hidden h-4 w-4 rounded-full border-2 border-grey-40 bg-white md:block z-10"></span>
          <div class="mt-1 flex items-start">
            <i class="bx bxs-right-arrow hidden text-primary md:block md:-mt-0.5"></i>
            <div class="md:-mt-1 md:pl-8">
              <span class="block font-body font-medium text-grey-40">{{ts.t().WORK_DATE}}</span>
              <span class="block pt-2 font-header text-lg font-bold uppercase tracking-wide text-primary lg:text-xl">JAVA &bull; ANGULAR &bull; POSTGRESQL</span>
              <div class="pt-3">
                <p class="font-body text-base leading-relaxed text-grey-20">
                  {{ts.t().WORK_DESC}}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
