<div class="w-full h-full min-h-[calc(100vh-120px)] flex flex-col justify-center items-center py-8 sm:py-12 bg-grey-50" id="portfolio">
  <div class="container my-auto flex flex-col items-center max-w-5xl px-4">
    <h2 class="text-center font-header text-3xl font-semibold uppercase text-primary sm:text-4xl lg:text-5xl mb-2">
      {{ts.t().PORTFOLIO_TITLE}}
    </h2>
    <p class="text-center font-body text-sm text-grey-20 mb-6 flex items-center gap-1.5">
      <i class="bx bx-pointer text-base text-primary"></i>
      <span>{{ ts.currentLang() === 'es' ? 'Haz clic en la imagen para visitar el sitio web ortegainmobiliaria.com.ar' : 'Click on the image to visit ortegainmobiliaria.com.ar' }}</span>
    </p>
    
    <!-- Clickable Screenshot Container -->
    <a 
      href="https://ortegainmobiliaria.com.ar" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="group relative block w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl border border-grey-60 bg-white p-2 sm:p-4 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-primary/20 cursor-pointer"
      title="Visitar Ortega Inmobiliaria"
    >
      <!-- Hover Overlay Badge -->
      <div class="absolute inset-0 bg-primary/10 opacity-0 group-hover:opacity-100 transition-opacity z-10 flex items-center justify-center pointer-events-none rounded-xl">
        <span class="rounded-full bg-primary px-5 py-2.5 font-header text-sm font-bold uppercase tracking-wider text-white shadow-xl flex items-center gap-2">
          <span>{{ ts.currentLang() === 'es' ? 'Visitar Sitio Web' : 'Visit Website' }}</span>
          <i class="bx bx-link-external text-lg"></i>
        </span>
      </div>

      <img 
        src="assets/img/work-experience.png" 
        class="w-full h-auto max-h-[68vh] object-contain rounded-xl shadow-md transition-transform duration-500 group-hover:scale-[1.005]" 
        alt="Ortega Inmobiliaria - Work Experience Screenshot" 
      />
    </a>
  </div>
</div>
